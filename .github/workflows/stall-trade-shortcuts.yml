name: Stall B Lobby + DEV F7 Launcher readiness (NO PUBLISH)
on:
  push:
    branches: [feat/stall-b-lobby-and-launcher-trade-ready-20261124]
  pull_request:
    branches: [main]
    paths:
      - Stall.lua
      - IronSoul_Launcher_Stall_V5.lua
      - tests/stall_b_lobby_mock.lua
      - tests/launcher_dev_trade_ready_mock.lua
      - .github/workflows/stall-trade-shortcuts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Syntax both live entrypoints and mocks
        run: |
          luac5.4 -p Stall.lua
          luac5.4 -p IronSoul_Launcher_Stall_V5.lua
          luac5.4 -p tests/stall_b_lobby_mock.lua
          luac5.4 -p tests/launcher_dev_trade_ready_mock.lua
      - name: B Hotkey exact Lobby remote mock
        run: lua5.4 tests/stall_b_lobby_mock.lua
      - name: Trade F7 DEV launcher ready and Back cleanup mock
        run: lua5.4 tests/launcher_dev_trade_ready_mock.lua
      - name: Previously verified Market Lite and Clone planner
        run: |
          lua5.4 tests/stall_market_lite_mock.lua
          lua5.4 tests/clone_shard_planner.lua
      - name: Only Release/Market — do not touch AIO
        run: echo 'Standalone Release only; publish by merge to main.'
